# 구형 Render 배포 청사진 (현재 운영 정본 아님)
#
# 운영 정본은 Cafe24 + https://www.matths.kr 이며 DEPLOY.md를 따른다.
# 이 파일은 과거 롤백·비교용으로만 보존한다. 현재 배포에 그대로 사용하지 않는다.
#
# 이 파일이 있으면 render.com → New → Blueprint 에서 레포만 고르면
# 런타임·빌드·시작 명령·헬스체크가 전부 자동으로 잡힌다. 대시보드에서
# 손으로 입력하다 오타 하나로 안 뜨는 일을 없애려고 둔다.
#
# **비밀은 이 파일에 없다.** sync: false 인 값은 Render 가 대시보드에서
# 직접 입력받고 레포에는 절대 기록하지 않는다 — 그래서 이 파일은 깃에 올려도 된다.
# (config.env 는 로컬 전용이고 배포에 올라가지 않는다)
services:
  - type: web
    name: matths-api
    runtime: node
    plan: free
    region: singapore # 한국에서 가장 가깝다
    buildCommand: npm install
    # 뜨기 전에 환경을 먼저 검사한다. 값이 비었거나 위험하면 여기서 멈추고
    # 무엇이 문제인지 로그에 적는다 — 첫 요청에서 이상하게 실패하는 것보다 낫다.
    startCommand: npm run preflight && npm run migrate:defender-index && npm start
    healthCheckPath: /api/v1/health
    autoDeploy: false # 배포는 사람이 누른다
    envVars:
      - key: NODE_ENV
        value: production # L-5. 쿠키 secure·메일 실발송·에러 상세 숨김이 여기 걸려 있다
      - key: DB
        sync: false # Atlas 접속 문자열 (L-2 로 비밀번호 교체한 뒤의 값)
      - key: SECRET
        generateValue: true # Render 가 무작위 생성 — 사람이 정하지 않는다
      - key: API_TOKEN_SECRET
        generateValue: true # SECRET 과 반드시 다른 값이어야 한다
      - key: API_TOKEN_TTL_SECONDS
        value: "2592000" # 30일
      - key: PASSWORD_RESET_SECRET
        generateValue: true
      - key: ARENA_QUESTION_PACK_SEED_SECRET
        generateValue: true
      - key: ARENA_DEFENDER_ASSIGNMENT_SEED_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false # 실제 도메인. localhost·trycloudflare 면 preflight 가 막는다
      - key: EMAIL_API_URL
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
