			shellScript = "# KICE 기출 원문은 권리 확인 전 내부 Debug 빌드에서만 사용한다.\n# File System Synchronized Group의 KiceBank 폴더는 target membership에서 제외하고,\n# 이 단계가 Debug 산출물에만 명시적으로 복사한다. Release에서는 복사하지 않을 뿐\n# 아니라 번들에 섞여 들어왔는지도 검사해 조용한 회귀를 막는다.\nSOURCE_DIR=\"${SRCROOT}/Matths/KiceBank\"\nBUNDLE_DIR=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nif [ \"${CONFIGURATION}\" = \"Debug\" ]; then\n  /bin/mkdir -p \"${BUNDLE_DIR}\"\n  for SOURCE_FILE in \"${SOURCE_DIR}\"/*; do\n    [ -f \"${SOURCE_FILE}\" ] || continue\n    # Finder resource fork/확장 속성을 서명 대상 번들로 복사하지 않는다.\n    /bin/cp -X -f \"${SOURCE_FILE}\" \"${BUNDLE_DIR}/$(basename \"${SOURCE_FILE}\")\"\n  done\n  echo \"Debug KICE 내부 자료 복사 완료\"\n  exit 0\nfi\nfor SOURCE_FILE in \"${SOURCE_DIR}\"/*; do\n  [ -f \"${SOURCE_FILE}\" ] || continue\n  BUNDLED_FILE=\"${BUNDLE_DIR}/$(basename \"${SOURCE_FILE}\")\"\n  if [ -e \"${BUNDLED_FILE}\" ]; then\n    echo \"error: 권리 확인 전 KICE 내부 자료가 ${CONFIGURATION} 번들에 포함됐다: ${BUNDLED_FILE}\"\n    exit 1\n  fi\ndone\necho \"${CONFIGURATION} KICE 자료 제외 게이트 통과\"\nif ! /bin/sh \"${SRCROOT}/scripts/verify-curriculum-story-bundle.sh\" \"${BUNDLE_DIR}\"; then\n  echo \"error: Release 커리큘럼 5분 해설 번들 게이트 실패\"\n  exit 1\nfi\necho \"\"\necho \"${CONFIGURATION} 커리큘럼 220개 번들 게이트 통과\"\n";
